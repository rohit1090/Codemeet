name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Build & lint the frontend ────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      # Inject placeholder env vars so the CRA build doesn't fail on missing vars
      - name: Create .env for build
        run: |
          echo "REACT_APP_BACKEND_URL=https://placeholder.railway.app" >> .env
          echo "REACT_APP_JUDGE0_URL=https://placeholder.railway.app"  >> .env

      - name: Build
        run: npm run build

      # Upload the build artifact so deploy-frontend can use it
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: build/
          retention-days: 1

  # ── Job 2: Deploy frontend to Vercel ────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: build-frontend
    # Only deploy on pushes to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Pull Vercel project settings (project.json / .vercel dir)
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Build with Vercel's own pipeline (picks up vercel.json)
      - name: Build for Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # ── Job 3: Deploy backend to Railway ────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Railway
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service codemeet-backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

# ── Required GitHub Secrets ──────────────────────────────────────────────────
# Set these in: GitHub repo → Settings → Secrets and variables → Actions
#
#   VERCEL_TOKEN   – Vercel personal access token (vercel.com/account/tokens)
#   RAILWAY_TOKEN  – Railway project token (railway.app → project → settings)
