# Judge0 configuration
# These env vars are read by the judge0/judge0 Docker image.

REDIS_URL=redis://judge0-redis:6379

POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0passwd

# Allow all origins (set to specific domain in production)
ALLOW_ORIGIN=*

# Disable authentication for local dev
AUTHN_HEADER=
AUTHN_TOKEN=
